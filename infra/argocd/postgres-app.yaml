# The one shared Postgres instance — platform infra, not per-tenant, so it's
# a plain Application over plain manifests rather than going through the
# tenant ApplicationSet.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hoa-postgres
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/marcxii/hoa-management-project.git
    targetRevision: main
    path: infra/postgres
  destination:
    server: https://kubernetes.default.svc
    namespace: hoa-platform
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
