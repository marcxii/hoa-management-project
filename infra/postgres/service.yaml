apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: hoa-platform
spec:
  # Headless: tenant apps connect to postgres.hoa-platform.svc.cluster.local
  # directly at the one pod, no load-balancing needed for a single-instance
  # Postgres.
  clusterIP: None
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
