# Plaintext-in-git is fine for a local kind demo cluster with throwaway
# credentials, not for anything real. On EKS this gets replaced by an
# External Secrets Operator ExternalSecret pulling from AWS Secrets Manager
# — same Secret name/keys, different source, no app or chart changes needed.
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  namespace: hoa-platform
type: Opaque
stringData:
  POSTGRES_PASSWORD: postgres_dev_password
  HOA_MIGRATOR_PASSWORD: migrator_dev_password
  HOA_APP_PASSWORD: app_dev_password
