apiVersion: v1
kind: Secret
metadata:
  name: {{ include "hoa-app.fullname" . }}
  labels:
    {{- include "hoa-app.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: "postgresql+asyncpg://hoa_app:{{ .Values.secrets.appPassword }}@{{ .Values.database.host }}:{{ .Values.database.port }}/{{ .Values.database.name }}"
  MIGRATOR_DATABASE_URL: "postgresql+asyncpg://hoa_migrator:{{ .Values.secrets.migratorPassword }}@{{ .Values.database.host }}:{{ .Values.database.port }}/{{ .Values.database.name }}"
  JWT_SECRET: {{ .Values.secrets.jwtSecret | quote }}
