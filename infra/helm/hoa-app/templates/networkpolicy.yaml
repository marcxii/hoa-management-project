{{- if .Values.networkPolicy.enabled }}
# Default-deny for this tenant's pods, with narrow exceptions: ingress-nginx
# can reach the app, the app can reach the shared Postgres and DNS, and
# nothing else. This is the namespace-per-tenant story made concrete — a
# compromised pod in one tenant's namespace can't reach another tenant's
# namespace, because nothing explicitly allows it to.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "hoa-app.fullname" . }}
  labels:
    {{- include "hoa-app.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "hoa-app.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8000
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: hoa-platform
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
{{- end }}
