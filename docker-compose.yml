# Local dev / smoke-test only — not what runs in kind or EKS. This exists so
# the multi-tenancy story (one shared Postgres, RLS-isolated; two separate
# app "deployments," one per tenant) can be demoed with nothing but Docker,
# before kind/Helm/ArgoCD enter the picture at all.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: hoa
      HOA_MIGRATOR_PASSWORD: migrator_dev_password
      HOA_APP_PASSWORD: app_dev_password
    ports:
      # Host port 55432, not 5432 — avoids clashing with any Postgres
      # already running natively on the host. Only matters for connecting
      # from outside Docker (e.g. running Alembic/pytest locally); the other
      # services here reach Postgres via the Docker network at port 5432.
      - "55432:5432"
    volumes:
      - ./infra/postgres/init.sh:/docker-entrypoint-initdb.d/init.sh:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build:
      context: ./app
    environment:
      MIGRATOR_DATABASE_URL: postgresql+asyncpg://hoa_migrator:migrator_dev_password@postgres:5432/hoa
    depends_on:
      postgres:
        condition: service_healthy
    command: ["alembic", "upgrade", "head"]

  # Sunset Ridge HOA — tenant A. Same image as app-oakwood; only TENANT_ID differs.
  app-sunset-ridge:
    build:
      context: ./app
    environment:
      TENANT_ID: 11111111-1111-1111-1111-111111111111
      DATABASE_URL: postgresql+asyncpg://hoa_app:app_dev_password@postgres:5432/hoa
      JWT_SECRET: dev-secret-change-me
    ports:
      - "8001:8000"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # Oakwood HOA — tenant B. Shares the same Postgres; RLS keeps the rows apart.
  app-oakwood:
    build:
      context: ./app
    environment:
      TENANT_ID: 22222222-2222-2222-2222-222222222222
      DATABASE_URL: postgresql+asyncpg://hoa_app:app_dev_password@postgres:5432/hoa
      JWT_SECRET: dev-secret-change-me
    ports:
      - "8002:8000"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
